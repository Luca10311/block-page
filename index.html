<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <title>Access Denied </title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20242c;
        background: #f5f6f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 440px);
        padding: 48px 36px;
        text-align: center;
        background: #fff;
        border: 1px solid #e7e9ee;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgb(26 35 52 / 7%);
      }

      .icon {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        margin: 0 auto 24px;
        color: #b42318;
        background: #fff1f0;
        border-radius: 50%;
      }

      .icon svg {
        width: 30px;
        height: 30px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 7vw, 2rem);
        line-height: 1.2;
        letter-spacing: -0.04em;
      }

      p {
        margin: 12px 0 0;
        color: #626b78;
        font-size: 1rem;
        line-height: 1.6;
      }

      @media (max-width: 480px) {
        main {
          padding: 40px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 3.5 21 20H3L12 3.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M12 9v4.5m0 3h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="page-title">Access Denied</h1>
      <p> I told you you would be blocked. LOL</p>
    </main>
  </body>
</html>
